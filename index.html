<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa de Campo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Paleta de marca; el resto del tema (grises, verdes, rojos) usa
        // los colores por defecto de Tailwind.
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f4ff',
                            100: '#ece9fe',
                            300: '#b8adfa',
                            500: '#7361ef',
                            600: '#5b45ea',
                            700: '#4c37c9',
                        },
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-white min-h-screen text-gray-900 antialiased">
<div class="max-w-md mx-auto px-5 py-8 sm:py-10">

    <header class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-2.5">
            <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-brand-50 text-brand-600">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
                    <path d="M3 10.5 12 3l9 7.5" />
                    <path d="M5.5 9.5V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.5" />
                    <path d="M9.5 21v-6h5v6" />
                </svg>
            </span>
            <div>
                <h1 class="text-base font-semibold tracking-tight text-gray-900 leading-none">Casa de Campo</h1>
                <p class="text-gray-400 text-xs mt-1">Control de pagos del sábado</p>
            </div>
        </div>
        <span class="hidden sm:inline-flex items-center gap-1.5 rounded-full bg-gray-50 text-gray-500 text-xs font-medium px-2.5 py-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
            En vivo
        </span>
    </header>

    <div class="grid grid-cols-3 divide-x divide-gray-200 mb-8">
        <div class="px-4 first:pl-0">
            <p class="text-[11px] font-medium uppercase tracking-wide text-gray-400">Total</p>
            <p id="txt-meta" class="mt-1 text-xl sm:text-2xl font-semibold tabular-nums text-gray-900">S/ 0.00</p>
        </div>
        <div class="px-4">
            <p class="text-[11px] font-medium uppercase tracking-wide text-gray-400">Recaudado</p>
            <p id="txt-recaudado" class="mt-1 text-xl sm:text-2xl font-semibold tabular-nums text-emerald-600">S/ 0.00</p>
        </div>
        <div class="px-4 last:pr-0">
            <p class="text-[11px] font-medium uppercase tracking-wide text-gray-400">Falta</p>
            <p id="txt-falta" class="mt-1 text-xl sm:text-2xl font-semibold tabular-nums text-rose-600">S/ 0.00</p>
        </div>
    </div>

    <form id="form-agregar" class="flex gap-2 mb-8">
        <input id="input-nombre" type="text" required placeholder="Nombre"
            class="flex-1 min-w-0 rounded-lg border border-gray-200 px-3.5 py-2.5 text-sm placeholder:text-gray-400 outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-100" />
        <input id="input-cuota" type="number" step="0.01" min="0" required placeholder="S/"
            class="w-20 rounded-lg border border-gray-200 px-3 py-2.5 text-sm placeholder:text-gray-400 outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-100" />
        <button type="submit"
            class="shrink-0 flex items-center justify-center h-[42px] w-[42px] rounded-lg bg-brand-600 text-white transition hover:bg-brand-700 active:scale-95"
            aria-label="Agregar persona" title="Agregar persona">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                <path d="M12 5v14M5 12h14" />
            </svg>
        </button>
    </form>

    <div id="lista">
        <p class="text-gray-400 text-sm text-center py-8">Cargando…</p>
    </div>

    <div class="mt-2 flex items-center gap-1">
        <button id="btn-exportar"
            class="flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm font-medium text-gray-500 transition hover:bg-gray-50 hover:text-gray-700">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
                <rect x="3" y="4" width="18" height="16" rx="2" />
                <circle cx="9" cy="10" r="1.6" />
                <path d="M21 16.5 15.5 11 7 19" />
            </svg>
            Exportar imagen
        </button>
        <button id="btn-reset"
            class="ml-auto flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm font-medium text-gray-400 transition hover:bg-rose-50 hover:text-rose-600">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
                <path d="M4 7h16" />
                <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                <path d="M6.5 7 7.3 19a1 1 0 0 0 1 .9h7.4a1 1 0 0 0 1-.9L18.5 7" />
                <path d="M10 11v6M14 11v6" />
            </svg>
            Borrar todo
        </button>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
